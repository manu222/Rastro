name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pinned so a change upstream can never silently alter what the tests run against.
env:
  HAYABUSA_VERSION: 4.0.0
  DATASET_COMMIT: 4ceed2f4706daf601c212a8f91c113dd85349a2c
  ZIRCOLITE_VERSION: v4.7.1
  # What CI was installing unpinned while it was green. pySigma is pinned with
  # it because sigma-cli accepts a range, and 2.0.2 is also the version the
  # category table in internal/winevent/category.go was read from.
  SIGMA_CLI_VERSION: 4.0.0
  PYSIGMA_VERSION: 2.0.2

jobs:
  rules:
    name: Detection rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The validators still download MITRE ATT&CK and D3FEND at run time, so
      # the tag check follows the live catalogue and fails without a network.
      # That is the same choice as the unpinned SigmaHQ clone below: tags are
      # checked against what ATT&CK says today.
      - name: Install sigma-cli
        run: |
          pip install --disable-pip-version-check \
            "sigma-cli==${SIGMA_CLI_VERSION}" "pysigma==${PYSIGMA_VERSION}"
          sigma version

      # Format check: catches a malformed rule before it ever runs.
      - name: Validate rule syntax
        run: sigma check rules/

      # The musl build is statically linked, so it runs on any Linux runner
      # regardless of the glibc version installed.
      - name: Install Hayabusa
        run: |
          mkdir -p tools/hayabusa
          curl -sSL -o hayabusa.zip \
            "https://github.com/Yamato-Security/hayabusa/releases/download/v${HAYABUSA_VERSION}/hayabusa-${HAYABUSA_VERSION}-lin-x64-musl.zip"
          unzip -q hayabusa.zip -d tools/hayabusa
          chmod +x tools/hayabusa/hayabusa-*
          tools/hayabusa/hayabusa-${HAYABUSA_VERSION}-lin-x64-musl help | head -2

      # Hayabusa reads EVTX and nothing else, so the Linux rules need a second
      # engine. Zircolite is cloned rather than installed from a package index
      # because it reads its field mapping from the config directory that ships
      # with the repository; the package alone leaves the mapping behind.
      - name: Install Zircolite
        run: |
          git clone --quiet --depth 1 --branch "${ZIRCOLITE_VERSION}" \
            https://github.com/wagga40/Zircolite.git tools/zircolite
          pip install --disable-pip-version-check ./tools/zircolite

      # Only the folders the manifests reference, at the pinned commit.
      - name: Fetch attack samples
        run: |
          git clone --filter=blob:none --sparse \
            https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES.git datasets
          cd datasets
          git checkout "${DATASET_COMMIT}"
          git sparse-checkout set \
            "Execution" "Initial Access" "Defense Evasion" "Persistence" "Credential Access"
          echo "Samples fetched: $(find . -name '*.evtx' | wc -l)"

      # The Linux samples are kept in Git LFS upstream, so a clone would bring
      # down pointer files instead of data. Each one is fetched individually at
      # the commit pinned in tests/linux-samples.txt.
      - name: Fetch Linux samples
        run: bash scripts/fetch-linux-samples.sh

      # Host and network evidence of the same machine, which is what the
      # network rules are checked against: Zeek logs and the Windows events of
      # the host they were captured from. About 20 MB, at the commit pinned in
      # tests/compound-samples.txt.
      - name: Fetch compound samples
        run: bash scripts/fetch-compound.sh

      # The public rule corpus, so that the coverage figure in the README is a
      # number CI checks rather than a claim. Shallow and unpinned on purpose:
      # the point is that the loader keeps up with the rules people actually
      # write, so it is measured against the current ones.
      - name: Fetch the public Sigma corpus
        run: git clone --quiet --depth 1 https://github.com/SigmaHQ/sigma.git tools/sigmahq

      - name: Vet
        run: go vet ./...

      # RASTRO_REQUIRE_TOOLS turns a missing dataset or binary into a failure
      # instead of a skip. Without it a broken setup would report success by
      # quietly running nothing at all.
      - name: Run rule tests
        env:
          RASTRO_REQUIRE_TOOLS: '1'
        run: go test ./... -v