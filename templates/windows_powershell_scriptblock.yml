#
# Generate a fresh id first — never reuse another rule's:
#     PowerShell:  [guid]::NewGuid()
# ==============================================================================

title: FILL — a short statement of the behaviour, not the tool
id: FILL — paste a new GUID here
status: experimental
description: |
    FILL — what this detects and, more importantly, WHY this signal is hard for
    an attacker to avoid. If the answer is "because the tool is called X", the
    rule is keyed on the wrong thing.
references:
    - FILL — https://attack.mitre.org/techniques/TXXXX/YYY/
author: FILL
date: FILL — YYYY-MM-DD
tags:
    # Verify both against current ATT&CK data: sigma check will reject stale
    # tactic names and retired technique IDs.
    - FILL — attack.<tactic>
    - FILL — attack.t<technique>
logsource:
    category: ps_script
    product: windows
detection:
    scriptblock:
        EventID: 4104
        Channel: Microsoft-Windows-PowerShell/Operational
    selection:
        # FILL — the fields that identify the behaviour.
        # e.g.  ScriptBlockText|contains: 'Invoke-Mimikatz'
        #       ScriptBlockText|contains|all:
        #           - 'System.Reflection'
        #           - 'VirtualAlloc'
    # Optional. Delete if the rule has no legitimate baseline to exclude.
    # Every exclusion is a blind spot: match on the most specific value you can,
    # and record what you are giving up.
    filter_main_legit:
        # FILL
    condition: FILL
falsepositives:
    - FILL — be specific. "Unknown" tells a future analyst nothing.
level: FILL — informational | low | medium | high | critical
ruletype: Sigma

# ------------------------------------------------------------------------------
# FIELDS AVAILABLE ON THIS EVENT
# Extracted from the real samples in datasets/, not from documentation.
# ------------------------------------------------------------------------------
#   MessageNumber, MessageTotal, Path, ScriptBlockId, ScriptBlockText
#
# Notes:
#   ScriptBlockText holds the script as PowerShell finally saw it, AFTER
#   deobfuscation. That is what makes this event valuable: base64 and string
#   mangling are already undone by the time it is logged.
#   Long scripts are split across several events; MessageNumber and MessageTotal
#   say which part this is. A rule matching one fragment may miss the rest.
#   Requires script block logging to be enabled by policy. Where it is off, this
#   whole rule family is blind — worth stating explicitly.
