    - FILL — attack.<tactic>
    - FILL — attack.t<technique>
logsource:
    category: file_event
    product: windows
detection:
    file_event:
        EventID: 11
        Channel: Microsoft-Windows-Sysmon/Operational
    selection:
        # FILL — the fields that identify the behaviour.
        # e.g.  TargetFilename|contains: '\\Startup\\'
        #       Image|endswith: '\\w3wp.exe'
    # Optional. Delete if the rule has no legitimate baseline to exclude.
    # Every exclusion is a blind spot: match on the most specific value you can,
    # and record what you are giving up.
    filter_main_legit:
        # FILL
    condition: FILL
falsepositives:
    - FILL — be specific. "Unknown" tells a future analyst nothing.
level: FILL — informational | low | medium | high | critical
ruletype: Sigma

# ------------------------------------------------------------------------------
# FIELDS AVAILABLE ON THIS EVENT
# Extracted from the real samples in datasets/, not from documentation.
# ------------------------------------------------------------------------------
#   CreationUtcTime, Image, ProcessGuid, ProcessId, RuleName, TargetFilename, UtcTime
