title: LSASS Memory Access With Read Rights
id: 3f2b9c14-7a5d-4e88-b0c3-9d1e6f4a2b77
status: experimental
description: |
    Detects a process opening a handle to lsass.exe requesting memory read
    rights. This is mandatory behaviour for any credential dumping technique,
    regardless of the tool used, which makes it resilient to renaming or
    reimplementation of the attacker's binary.
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: Manuel Araujo
date: 2026-09-09
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    category: process_access
    product: windows
detection:
    process_access:
        EventID: 10
        Channel: Microsoft-Windows-Sysmon/Operational
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess:
            - '0x1010'
            - '0x1410'
            - '0x1418'
            - '0x1438'
            - '0x143a'
            # Full access, which includes the read. Every dumper of the
            # compound corpus that missed this rule asked for one of these:
            # procdump (02), the Out-Minidump payload (04), SharpDump (05) and
            # Dumpert (06), whose direct syscalls Sysmon 10 still sees. On
            # EVTX-ATTACK-SAMPLES they add 15 records in 5 files, every one an
            # attack; the one benign full-access open, services.exe, is the
            # filter below.
            - '0x1f1fff'
            - '0x1f3fff'
            - '0x1fffff'
    filter_main_scm:
        SourceImage: 'C:\Windows\System32\services.exe'
    condition: process_access and selection and not 1 of filter_main_*
falsepositives:
    - Antivirus and EDR products, which legitimately inspect LSASS memory
    - Administration tools such as Process Explorer run by an administrator
level: high
ruletype: Sigma
