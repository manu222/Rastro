title: Acceso a la memoria de LSASS con permisos de lectura
id: 3f2b9c14-7a5d-4e88-b0c3-9d1e6f4a2b77
status: experimental
description: |
    Detecta procesos que abren un manejador contra lsass.exe solicitando permisos
    de lectura de memoria. Es el comportamiento obligatorio de cualquier volcado de
    credenciales, con independencia de la herramienta utilizada.
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: Manuel Araújo
date: 2026-09-09
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    category: process_access
    product: windows
detection:
    process_access:
        EventID: 10
        Channel: Microsoft-Windows-Sysmon/Operational
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess:
            - '0x1010'
            - '0x1410'
            - '0x1418'
            - '0x1438'
            - '0x143a'
    filter_main_scm:
        SourceImage: 'C:\Windows\System32\services.exe'
    condition: process_access and selection and not 1 of filter_main_*
falsepositives:
    - Antivirus y soluciones EDR, que inspeccionan legítimamente la memoria de LSASS
    - Herramientas de administración como Process Explorer ejecutadas por un administrador
level: high
ruletype: Sigma
