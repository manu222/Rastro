  license: GPL-3.0
  note: referenced, not redistributed

expect:
  - file: Defense Evasion/DE_renamed_psexec_service_sysmon_17_18.evtx
    hits: 6
    note: >-
      The three stream pipes, each appearing as a creation and as a connection:
      svchost-MSEDGEWIN10-8116-stdin, -stdout and -stderr. The prefix is the
      renamed service; the suffixes are what the program always writes.

total: 6
