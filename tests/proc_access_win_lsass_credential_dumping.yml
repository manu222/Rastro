# Test manifest for rules/windows/proc_access_win_lsass_credential_dumping.yml
#
# The rule detects the behaviour every credential dumping technique needs: a
# handle opened against lsass.exe with memory read rights. These samples prove it
# catches four unrelated toolchains without naming any of them.

rule: rules/windows/proc_access_win_lsass_credential_dumping.yml
rule_id: 3f2b9c14-7a5d-4e88-b0c3-9d1e6f4a2b77

dataset:
  repo: https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES
  commit: 4ceed2f4706daf601c212a8f91c113dd85349a2c
  license: GPL-3.0
  note: referenced, not redistributed

expect:
  - file: Credential Access/sysmon_10_lsass_mimikatz_sekurlsa_logonpasswords.evtx
    hits: 1
    granted_access: ["0x1010"]
    note: >
      Mimikatz running from disk under its own name, sekurlsa::logonpasswords.
      The obvious case, and the only one a rule keyed on the tool name would find.

  - file: Credential Access/babyshark_mimikatz_powershell.evtx
    hits: 2
    granted_access: ["0x1010"]
    note: >
      BabyShark campaign. Mimikatz loaded reflectively inside powershell.exe,
      so there is no mimikatz.exe on disk at any point.

  - file: Credential Access/sysmon_3_10_Invoke-Mimikatz_hosted_Github.evtx
    hits: 1
    granted_access: ["0x143a"]
    note: Invoke-Mimikatz pulled from GitHub and executed in memory.

  - file: Credential Access/tutto_malseclogon.evtx
    hits: 1
    granted_access: ["0x1410"]
    note: >
      MalSecLogon, which abuses the Secondary Logon service to obtain a handle to
      LSASS. Yet another toolchain, found without naming it.

  - file: Persistence/sysmon_20_21_1_CommandLineEventConsumer.evtx
    hits: 1
    granted_access: ["0x1410"]
    note: >
      python.exe reading LSASS memory. Filed under Persistence rather than
      Credential Access in the dataset, which is precisely why detecting the
      behaviour beats curating a list of known tools.

  # Full access. A dumper has no reason to ask for less than everything, and
  # until these masks were listed four of the seven compound campaigns found
  # only the log being cleared.
  - file: Credential Access/CA_sysmon_hashdump_cmd_meterpreter.evtx
    hits: 1
    granted_access: ["0x1f1fff"]
    note: Meterpreter hashdump from a payload named voice_mail.msg.exe.

  - file: Credential Access/sysmon_10_11_outlfank_dumpert_and_andrewspecial_memdump.evtx
    hits: 8
    granted_access: ["0x1fffff"]
    note: >
      Outflank-Dumpert.exe (2), AndrewSpecial.exe (2) and rundll32.exe (4),
      all with the same mask. Dumpert uses direct syscalls and Sysmon 10 sees it anyway: the
      handle is reported from the kernel callback, not from a user-mode hook.

  - file: Credential Access/sysmon_10_11_lsass_memdump.evtx
    hits: 2
    granted_access: ["0x1fffff"]
    note: procdump.exe, and taskmgr.exe with the same mask.

  - file: Credential Access/sysmon_2x10_lsass_with_different_pid_RtlCreateProcessReflection.evtx
    hits: 3
    granted_access: ["0x1fffff"]
    note: procdump and procdump64 cloning lsass through RtlCreateProcessReflection.

  - file: Defense Evasion/DE_BYOV_Zam64_CA_Memdump_sysmon_7_10.evtx
    hits: 1
    granted_access: ["0x1fffff"]
    note: ppldump.exe, in a capture that also loads the Zam64 driver.

# --- Verified exclusion -------------------------------------------------------
#
# The rule excludes C:\Windows\System32\services.exe. That exclusion was checked
# against a real attack sample rather than assumed:
# ppl_bypass_ppldump_knowdll_hijack_sysmon_security.evtx contains a services.exe
# access to lsass.exe with GrantedAccess 0x1410, but its call trace runs through
# EventAggregation.dll — ordinary Windows service machinery, not the attack. The
# exclusion is hiding noise, not a technique.
#
# --- Known gaps ---------------------------------------------------------------
#
# Recorded here rather than left unsaid. A detection whose limits nobody can
# audit is a detection nobody should rely on.

known_gaps:
  - sample: Credential Access/ppl_bypass_ppldump_knowdll_hijack_sysmon_security.evtx
    technique: T1003.001 via PPL bypass
    why: >
      PPLdump opens lsass.exe with GrantedAccess 0x1000 — PROCESS_QUERY_LIMITED_
      INFORMATION alone, without the PROCESS_VM_READ bit this rule keys on. It
      defeats LSASS process protection through a known-DLL hijack and reaches the
      memory by a route that never shows up as a read handle from the attacking
      process. Widening the access mask would not fix this and would wreck the
      false positive rate; covering it needs a separate rule watching for the
      hijack itself.

# Repository-wide total across the whole dataset.
#
# Fewer than this means the rule stopped matching something it should.
# MORE than this means the services.exe exclusion filter broke and the rule is
# firing on the legitimate Service Control Manager again. Both are regressions,
# and only this total catches the second one.
total: 21
